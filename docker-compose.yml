services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "radar", "-d", "radar"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
