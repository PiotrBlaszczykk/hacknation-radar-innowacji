[project]
name = "radar-backend"
version = "0.1.0"
description = "Radar Innowacji: API"
requires-python = ">=3.12"
license = "EUPL-1.2"
dependencies = [
    "flask>=3.1",
    "flask-cors>=5.0",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
