version: "2.0"
criteria:
  - key: problem
    label: Waga i skala problemu
    weight: 20
    question: Jakie skutki problemu i jaką skalę dokumentuje karta?
    checks:
      - {key: odbiorcy, points: 1, text: "Opisano konkretną przeszkodę oraz grupę, której rzeczywiście dotyczy."}
      - {key: konsekwencje, points: 2, text: "Przeszkoda powoduje znaczące straty, ryzyko zdrowotne lub utrudnienie dostępu do ważnej usługi."}
      - {key: zasieg, points: 2, text: "Skalę istniejącego problemu opisano konkretną liczbą dotkniętych osób, zdarzeń lub organizacji, albo porównywalnym pomiarem skali."}
    missing_question: Ilu osób lub organizacji dotyczy problem i jakie są jego skutki?
  - key: nowosc
    label: Nowość rozwiązania
    weight: 15
    question: Co konkretnie odróżnia rozwiązanie od dotychczasowej praktyki?
    checks:
      - {key: mechanizm, points: 1, text: "Opisano konkretne, rozpoznawalne rozwiązanie i sposób jego działania."}
      - {key: roznica, points: 2, text: "Porównano działanie rozwiązania z dotychczasową praktyką lub konkretną alternatywą i opisano istotną różnicę."}
      - {key: porownanie, points: 2, text: "Różnicę względem nazwanej alternatywy udokumentowano porównawczym pomiarem działania albo wykazano ją dla więcej niż jednej alternatywy."}
    missing_question: Jakie podobne rozwiązania znacie i co Wasze podejście zmienia w praktyce?
  - key: dowody
    label: Dojrzałość i dowody skuteczności
    weight: 20
    question: Jak mocne są przedstawione dowody, że rozwiązanie przynosi zamierzony efekt?
    checks:
      - {key: proba, points: 1, text: "Podano rzeczywiste użycie rozwiązania, wykonaną próbę lub przeprowadzony test prototypu."}
      - {key: efekt, points: 2, text: "Wynik zakończonej próby zawiera pomiar korzyści dla odbiorcy lub poprawy działania. Sama liczba uczestników, zgłoszeń, produktów albo wykonanych czynności nie wystarcza."}
      - {key: odniesienie, points: 2, text: "Zaobserwowaną poprawę wykazano pomiarem przed i po, testem względem wzorca lub względem grupy porównawczej."}
    missing_question: Co sprawdziliście, jaki efekt zmierzyliście i do czego go porównaliście?
  - key: przenoszalnosc
    label: Przenoszalność
    weight: 20
    question: Co inna organizacja może przejąć i jakie istnieją na to dowody?
    checks:
      - {key: element, points: 1, text: "Opisano konkretną procedurę, narzędzie lub materiały, które można przekazać kolejnym użytkownikom."}
      - {key: warunki, points: 2, text: "Karta pokazuje, jak inna organizacja może przejąć rozwiązanie i jakie warunki lub zmiany są potrzebne."}
      - {key: replikacja, points: 2, text: "Karta potwierdza, że rozwiązanie zastosowano w co najmniej dwóch niezależnych organizacjach lub lokalizacjach. Współpraca przy jednym wdrożeniu nie wystarcza."}
    missing_question: Co inna organizacja może przejąć, a które kroki lub warunki musiałaby dostosować?
  - key: wykonalnosc
    label: Wykonalność dalszego wdrożenia
    weight: 15
    question: Jakie warunki, koszty lub zasoby są potwierdzone dla dalszego wdrożenia?
    checks:
      - {key: zasob, points: 1, text: "Wskazano co najmniej jeden konkretny zasób lub wymóg potrzebny do wdrożenia rozwiązania."}
      - {key: dostepnosc, points: 2, text: "Potwierdzono dostępność kluczowych zasobów, finansowania lub wymaganej zgody na kolejne wdrożenie."}
      - {key: plan, points: 2, text: "Dla kolejnego wdrożenia podano zarówno konkretny koszt lub zabezpieczony budżet, jak i jednostkę lub rolę odpowiedzialną."}
    missing_question: Jakich ludzi, środków, narzędzi lub zgód potrzebujecie do kolejnego wdrożenia?
  - key: wplyw
    label: Wpływ społeczny lub gospodarczy
    weight: 10
    question: Jaką zmianę dla odbiorców uzasadnia opis rozwiązania?
    checks:
      - {key: korzysc, points: 1, text: "Opisano konkretną korzyść, której może oczekiwać określona grupa odbiorców."}
      - {key: rezultat, points: 2, text: "Podano już zmierzoną zmianę dla odbiorców w czasie, koszcie, dostępie, jakości usługi lub bezpieczeństwie."}
      - {key: trwalosc, points: 2, text: "Karta potwierdza, że zmierzona korzyść dla odbiorców utrzymała się w kolejnych pomiarach lub została wykazana także w innym miejscu."}
    missing_question: Kto skorzysta z rozwiązania, czego może oczekiwać i po czym poznacie zmianę?
