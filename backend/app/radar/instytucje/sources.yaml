      title: Mobilny Urzędnik w Rzeszowie
      match: odwiedził już 190 mieszkańców
      summary: Mieszkańcy, którym trudno samodzielnie dotrzeć do urzędu, mogą skorzystać z bezpłatnej wizyty pracownika w domu. W pierwszej połowie 2026 r. mobilny urzędnik odwiedził 190 mieszkańców Rzeszowa.
      problem: Część mieszkańców ma trudności z dotarciem do urzędu ze względu na wiek, stan zdrowia lub niepełnosprawność.
      solution: Od 2022 r. urząd bezpłatnie wysyła pracownika do domu mieszkańca. Pracownik dostarcza formularze, pomaga je wypełnić i zabiera dokumenty do urzędu, a po rozpatrzeniu może dostarczyć decyzję.
      evidence: W dniu publikacji miasto podało ponad 500 korzystających od uruchomienia usługi. W pierwszym półroczu 2026 r. urzędnik odwiedził 190 mieszkańców.
    - path: /41-miasto-rzeszow/1713-aktualnosci/130685.html
      title: Rzeszowski urzędomat do odbioru dowodów rejestracyjnych
      match: na odebranie dowodu rejestracyjnego jest 48 godzin
      summary: Rzeszów uruchomił całodobowy odbiór dowodów rejestracyjnych przez urzędomat. Po otrzymaniu SMS-a od urzędu mieszkaniec ma 48 godzin na odbiór dokumentu.
      problem: Odbiór dowodu rejestracyjnego był związany z godzinami pracy urzędu.
      solution: Rzeszów uruchomił całodobowy odbiór dowodu rejestracyjnego. Mieszkaniec wybiera urzędomat przy złożeniu dokumentów, a po umieszczeniu w nim dowodu urząd wysyła SMS.
      evidence: Urząd udostępnił odbiór 24 godziny na dobę, 7 dni w tygodniu. Po otrzymaniu zawiadomienia mieszkaniec ma 48 godzin na odbiór.
    - path: /41-miasto-rzeszow/1713-aktualnosci/90169-za-posrednictwem-aplikacji-szybko-zglosisz-miastu-problem.html
      title: Zgłaszanie usterek przez aplikację Rzeszów To MY
      match: po zgłoszeniu użytkownika aplikacji naprawiono także chodniki
      problem: Mieszkańcy potrzebowali łatwego sposobu zawiadamiania miasta o usterkach w przestrzeni publicznej.
      solution: Miasto włączyło przyjmowanie zgłoszeń o usterkach do aplikacji Rzeszów To MY, działającej od jesieni 2022 r.
      evidence: Po zgłoszeniach mieszkańców miasto zamontowało zjazdy dla wózków przy schodach w okolicy ulic Bieckiej i Baligrodzkiej oraz naprawiło chodniki.

