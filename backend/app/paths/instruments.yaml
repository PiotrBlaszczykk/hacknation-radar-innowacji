  checked_at: '2026-11-21'
  verified: true
  after_step: 2
  step_title: Zbadaj możliwość finansowania inwestycji wdrożeniowej
  guidance: Przygotuj wyniki zakończonych prac B+R i dokumentację praw. Jeśli firma jest MŚP, sprawdź aktualną dokumentację i harmonogram PARP.

- id: uprp-zgloszenie
  name: Zgłoszenie wynalazku lub wzoru użytkowego
  provider: Urząd Patentowy RP
  description: Krajowa procedura ubiegania się o patent na wynalazek albo o prawo ochronne na wzór użytkowy.
  audience: Uprawnione osoby lub podmioty zamierzające chronić rozwiązanie techniczne.
  organization_kinds: [szkola, uczelnia, firma, jst, instytucja_publiczna, ngo, iob, inwestor]
  innovation_kinds: [technologiczna]
  stages: [pomysl, prototyp, pilotaz, wdrozona, skalowana]
  paths: [rozwoj, transfer, komercjalizacja]
