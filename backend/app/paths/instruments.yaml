- id: pci-protolab
  name: Pracownie PCI ProtoLab
  provider: Podkarpackie Centrum Innowacji
  description: Bezpłatna przestrzeń z wyposażeniem do prototypowania w Rzeszowie na zasadach regulaminu użytkownika.
  audience: Osoby w wieku 16–30 lat mieszkające lub uczące się na Podkarpaciu oraz pracownicy naukowi spełniający kryterium z regulaminu.
  organization_kinds: [szkola, uczelnia]
  innovation_kinds: [technologiczna, edukacyjna]
  stages: [pomysl, prototyp]
  paths: [rozwoj]
  region: podkarpackie
  url: https://protolab.pcinn.org/assets/Protolab/Umowa%20ProtoLab.pdf
  checked_at: '2026-11-21'
  verified: true
  after_step: 2
  step_title: Sprawdź dostęp do stanowiska prototypowania
  guidance: Zweryfikuj, kto z zespołu spełnia warunki użytkownika. Ustal z ProtoLabem, jakiego stanowiska potrzebujecie do wykonania lub poprawienia prototypu.

- id: pci-preinkubacja
  name: Preinkubacja PCI
  provider: Podkarpackie Centrum Innowacji
  description: Wsparcie w opracowaniu koncepcji oraz budowie funkcjonalnego prototypu produktu lub usługi.
  audience: Uczniowie i studenci z Podkarpacia ze statusem użytkownika PCI ProtoLab.
  organization_kinds: [szkola, uczelnia]
  innovation_kinds: [technologiczna, edukacyjna, spoleczna]
  stages: [pomysl]
  paths: [rozwoj]
  region: podkarpackie
  url: https://pcinn.org/wp-content/uploads/2026/04/2026_04_22_Regulamin-programu-Preinkubacji.pdf
  checked_at: '2026-11-21'
  verified: true
  after_step: 1
  step_title: Sprawdź możliwość skorzystania z Preinkubacji
  guidance: Jeśli projekt prowadzą uczniowie lub studenci, potwierdź w PCI terminy i uprawnienia. Przygotuj opis prototypu, jego funkcji i potrzebnych materiałów.

- id: pci-granty-br
  name: Program grantowy PCI na prace B+R
  provider: Podkarpackie Centrum Innowacji
  description: Finansowanie prac jednostek naukowych nad prototypami i technologiami o potencjale wdrożeniowym. Piąty nabór zakończył się 20 listopada 2026 r.
  audience: Zespoły badawcze uczelni objętych regulaminem konkursu.
  organization_kinds: [uczelnia]
  innovation_kinds: [technologiczna]
  stages: [pomysl, prototyp]
  paths: [rozwoj]
  region: podkarpackie
  url: https://projekty.pcinn.org/konkurs-br-n5
  checked_at: '2026-11-21'
  verified: true
  after_step: 1
  step_title: Porównaj zakres projektu z programem grantowym PCI
  guidance: Piąty nabór jest zamknięty. Użyj jego dokumentacji do sprawdzenia dojrzałości technologii i oszacowania kosztów dalszych prac B+R. Zapytaj PCI o kolejną edycję.

- id: pci-protostarter
  name: Protostarter PCI
  provider: Podkarpackie Centrum Innowacji
  description: ProtoLab opisuje program dla zespołów projektowych. Dostępność aktualnej edycji pozostaje do potwierdzenia.
  audience: Zespoły projektowe. Szczegółowe warunki bieżącej edycji wymagają potwierdzenia.
  organization_kinds: [szkola, uczelnia]
  innovation_kinds: [technologiczna]
  stages: [prototyp]
  paths: [rozwoj]
  region: podkarpackie
  url: https://protolab.pcinn.org/
  checked_at: '2026-11-21'
  verified: false
  after_step: 1
  step_title: Zapytaj PCI o dostępność Protostartera
  guidance: Przed planowaniem prac potwierdź, czy program przyjmuje zespoły i do których projektów jest skierowany.

- id: ncbr-smart-konsorcja
  name: Ścieżka SMART NCBR dla konsorcjów
  provider: Narodowe Centrum Badań i Rozwoju
  description: Finansowanie projektów B+R realizowanych wspólnie. Konsorcjum prowadzi przedsiębiorstwo.
  audience: Przedsiębiorstwa jako liderzy. Organizacje badawcze i NGO mogą uczestniczyć jako konsorcjanci na zasadach naboru.
