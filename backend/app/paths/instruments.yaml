  step_title: Zweryfikuj możliwość wspólnych prac B+R z firmą
  guidance: Jeśli po dotychczasowych testach pozostały zadania B+R, ustal ich podział z potencjalnym liderem biznesowym i sprawdź dokumentację właściwego naboru.

